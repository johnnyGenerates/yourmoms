<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#ff2b87">
  <title>MOMS Wine Rush</title>
  <style>
    :root{--pink:#ff2b87;--hot:#ff006e;--cream:#fff4dc;--ink:#35152a;--gold:#ffd23f}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#240d22;color:white;font-family:Arial Black,Arial,sans-serif;overflow:hidden;touch-action:none}
    body{display:grid;place-items:center;background:linear-gradient(110deg,#510653 0%,#74105c 46%,#b52469 100%)}
    button{font:inherit}.game{position:relative;width:min(100vw,560px);height:100dvh;max-height:900px;overflow:hidden;background:linear-gradient(110deg,#510653 0%,#74105c 46%,#b52469 100%);box-shadow:0 0 50px #0009;isolation:isolate}
    .game:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 68px,#ffffff0b 69px 71px),linear-gradient(transparent 56%,#ffffff18 56% 57%,transparent 57%);pointer-events:none}
    .hud{position:absolute;z-index:5;inset:max(10px,env(safe-area-inset-top)) 12px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
    .pill{background:#160714d9;border:2px solid #ffffff38;border-radius:18px;padding:8px 12px;min-width:92px;text-align:center;text-shadow:0 2px #000}.pill b{display:block;color:var(--gold);font-size:22px;line-height:1}.pill small{font:700 10px Arial;letter-spacing:1px}
    #pause{pointer-events:auto;border:0;min-width:48px;color:white;cursor:pointer}
    canvas{position:absolute;inset:0;width:100%;height:100%}
    .toast{position:absolute;z-index:6;top:19%;left:50%;width:88%;translate:-50% 0;text-align:center;font-size:clamp(20px,6vw,34px);color:#fff;text-shadow:0 4px 0 #82104c,0 6px 12px #000;transform:scale(0);transition:.15s;pointer-events:none}.toast.show{transform:scale(1)}
    .overlay{position:absolute;z-index:10;inset:0;display:grid;place-items:center;padding:24px;background:#170818d9;backdrop-filter:blur(7px);text-align:center}.card{width:min(100%,420px);background:linear-gradient(145deg,#fff8e8,#ffd6e8);color:var(--ink);border:5px solid white;border-radius:28px;padding:24px 20px;box-shadow:0 18px 0 #7c124f,0 25px 55px #000b;transform:rotate(-1deg)}
    h1{margin:0;color:var(--hot);font-size:clamp(36px,12vw,66px);line-height:.83;letter-spacing:-3px;text-shadow:3px 3px 0 white,6px 6px 0 #ff99c8}.tag{margin:15px 0 10px;font-size:17px}.how{margin:14px 0;background:#fff;border-radius:16px;padding:11px;font:700 14px Arial;line-height:1.4}.play{width:100%;border:0;border-radius:18px;padding:16px;background:linear-gradient(#ff4c9a,#f00068);color:white;font-size:24px;box-shadow:0 7px 0 #9c0648;cursor:pointer}.play:active{translate:0 5px;box-shadow:0 2px 0 #9c0648}.tiny{font:12px Arial;margin:13px 0 0;opacity:.7}.hidden{display:none}.final-score{font-size:52px;color:var(--hot);line-height:1;margin:10px}.newbest{color:#a06a00;font-size:18px}
    .share{margin-top:13px;background:#111;box-shadow:0 7px 0 #555;font-size:18px}.share:active{box-shadow:0 2px 0 #555}
    @media (prefers-reduced-motion:reduce){.toast{transition:none}}
  </style>
</head>
<body>
<main class="game" id="game" aria-label="MOMS Wine Rush game">
  <canvas id="canvas"></canvas>
  <div class="hud hidden" id="hud">
    <div class="pill"><small>SCORE</small><b id="score">0</b></div>
    <div class="pill"><small>COMBO</small><b id="combo">x1</b></div>
    <button class="pill" id="pause" aria-label="Pause game">Ⅱ</button>
  </div>
  <div class="toast" id="toast" aria-live="polite"></div>
  <section class="overlay" id="start">
    <div class="card">
      <h1>MOMS<br>WINE RUSH</h1>
      <p class="tag">Happy hour has gone completely out of control.</p>
      <div class="how">🍷 Catch the red wine<br>☕ Avoid the coffee<br>👆 Drag MOMS or use ← →</div>
      <button class="play" id="play">LET'S GET WILD</button>
      <p class="tiny">Sound on • Best score: <span id="bestStart">0</span></p>
    </div>
  </section>
  <section class="overlay hidden" id="over">
    <div class="card">
      <h1>OH,<br>MOTHER!</h1>
      <p class="tag" id="verdict">That coffee ruined everything.</p>
      <div class="final-score" id="finalScore">0</div>
      <div class="newbest hidden" id="newBest">🏆 NEW HIGH SCORE!</div>
      <button class="play" id="again">ONE MORE ROUND</button>
      <button class="play share" id="share">SHARE SCORE ON 𝕏</button>
      <p class="tiny">Best score: <span id="bestOver">0</span></p>
    </div>
  </section>
</main>

  function size(){dpr=Math.min(devicePixelRatio||1,2);W=game.clientWidth;H=game.clientHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);mom.y=H-146;if(!mom.x)mom.x=W/2;}
  addEventListener('resize',size);size();
  function sound(n){try{audio ||= new AudioContext();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.type=n==='bad'?'sawtooth':'sine';o.frequency.setValueAtTime(n==='bad'?120:500,audio.currentTime);if(n!=='bad')o.frequency.exponentialRampToValueAtTime(900,audio.currentTime+.09);g.gain.setValueAtTime(.12,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.13);o.start();o.stop(audio.currentTime+.14)}catch(e){}}
  function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('show'),650)}
  function reset(){score=0;combo=1;lives=3;speed=1;items=[];particles=[];mom.x=mom.target=W/2;spawn=0;last=performance.now();playing=true;paused=false;hud.classList.remove('hidden');updateHud();requestAnimationFrame(loop)}
  function updateHud(){$('#score').textContent=score;$('#combo').textContent='x'+combo;$('#pause').textContent=paused?'▶':'Ⅱ'}
  function start(){audio?.resume();$('#start').classList.add('hidden');$('#over').classList.add('hidden');reset()}
  $('#play').onclick=start;$('#again').onclick=start;
  $('#share').onclick=()=>{
    const post=`I scored ${score} points in MOMS Wine Rush! 🍷\n\nThink you can beat me?\nhttps://yourmoms.xyz/game/\n\n$MOMS`;
    window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(post),'_blank','noopener,noreferrer');
  };
  $('#pause').onclick=()=>{if(!playing)return;paused=!paused;updateHud();if(!paused){last=performance.now();requestAnimationFrame(loop)}else say('MOMS NEEDS A BREATHER')};
  function target(e){let r=game.getBoundingClientRect();mom.target=Math.max(mom.w/2,Math.min(W-mom.w/2,(e.touches?e.touches[0].clientX:e.clientX)-r.left))}
  game.addEventListener('pointerdown',target);game.addEventListener('pointermove',e=>{if(e.buttons)target(e)});game.addEventListener('touchmove',e=>{target(e);e.preventDefault()},{passive:false});
  const keys={};addEventListener('keydown',e=>{keys[e.key]=1;if(e.key===' '){e.preventDefault();$('#pause').click()}});addEventListener('keyup',e=>keys[e.key]=0);
  function add(){let wine=Math.random()>.24,rare=wine&&Math.random()<.08;items.push({x:26+Math.random()*(W-52),y:-35,r:rare?26:22,vy:(145+Math.random()*65)*speed,type:rare?'bottle':wine?'wine':'coffee',spin:(Math.random()-.5)*2,a:0})}
  function burst(o,col){for(let i=0;i<10;i++)particles.push({x:o.x,y:o.y,vx:(Math.random()-.5)*240,vy:-Math.random()*180-40,life:1,col})}
  function hit(o){if(o.type==='coffee'){lives--;combo=1;sound('bad');navigator.vibrate?.(100);burst(o,'#6b351c');say(['NOT THE COFFEE!','DECAF? DISGUSTING.','WHO INVITED COFFEE?'][Math.random()*3|0]);if(lives<=0)return end()}else{let pts=(o.type==='bottle'?5:1)*combo;score+=pts;combo=Math.min(8,combo+1);speed=1+Math.min(score/140,1.45);sound('good');navigator.vibrate?.(25);burst(o,o.type==='bottle'?'#ffd23f':'#ff2b87');say(o.type==='bottle'?'JACKPOT, DARLING! +'+pts:combo>4?['CHEERS!','POUR DECISIONS!','MOMS ON FIRE!'][Math.random()*3|0]:'+'+pts)}updateHud()}
  function end(){playing=false;hud.classList.add('hidden');let isNew=score>best;if(isNew){best=score;localStorage.momsWineRushBest=best}$('#finalScore').textContent=score+' POINTS';$('#bestOver').textContent=best;$('#newBest').classList.toggle('hidden',!isNew);$('#verdict').textContent=score<10?'MOMS has had slower Tuesdays.':score<40?'Respectable. But MOMS wants another round.':'Absolute backyard legend.';setTimeout(()=>$('#over').classList.remove('hidden'),450)}
  function drawMom(){x.save();x.translate(mom.x,mom.y);x.imageSmoothingEnabled=false;x.fillStyle='#f5bd91';x.fillRect(-52,64,13,42);x.fillRect(39,64,13,42);x.fillStyle='#ff2b87';x.beginPath();x.roundRect(-48,58,96,61,18);x.fill();x.fillStyle='#1c315d';x.fillRect(-43,112,35,15);x.fillRect(8,112,35,15);x.fillStyle='white';x.textAlign='center';x.font='900 20px Arial';x.fillText('$MOMS',0,96);x.save();x.beginPath();x.arc(0,27,55,0,Math.PI*2);x.clip();if(momFace.complete)x.drawImage(momFace,-55,-28,110,110);x.restore();x.strokeStyle='white';x.lineWidth=4;x.beginPath();x.arc(0,27,55,0,Math.PI*2);x.stroke();x.restore()}
  function drawLives(){x.font='20px serif';x.textAlign='left';x.fillText('❤️'.repeat(lives),12,H-18)}

  function loop(t){if(!playing||paused)return;let dt=Math.min((t-last)/1000,.035);last=t;if(keys.ArrowLeft||keys.a)mom.target-=360*dt;if(keys.ArrowRight||keys.d)mom.target+=360*dt;mom.target=Math.max(51,Math.min(W-51,mom.target));mom.x+=(mom.target-mom.x)*Math.min(1,dt*14);spawn-=dt;if(spawn<=0){add();spawn=Math.max(.34,.95/speed)}for(let i=items.length-1;i>=0;i--){let o=items[i];o.y+=o.vy*dt;o.a+=o.spin*dt;if(o.y+o.r>mom.y+18&&o.y-o.r<mom.y+112&&Math.abs(o.x-mom.x)<55){items.splice(i,1);hit(o);continue}if(o.y>H+45){items.splice(i,1);if(o.type!=='coffee'){combo=1;updateHud()}}}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=360*dt;p.life-=dt*1.8;if(p.life<=0)particles.splice(i,1)}render();requestAnimationFrame(loop)}
