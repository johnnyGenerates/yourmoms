<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Follow Your $MOMS everywhere.">
  <title>Follow Your $MOMS</title>

  <link rel="icon" type="image/png" href="/favicon.png">

  <link rel="stylesheet" href="socials/style.css?v=facebook-20260925-2">
  <style>
    .tiktok-button {
      width:94%; border:5px solid white; border-radius:55px 28px 55px 28px;
      background:linear-gradient(145deg,#252525,#080808 60%,#181818);
      box-shadow:-4px 7px 0 #25f4ee,4px 11px 0 #fe2c55,0 16px 25px rgba(0,0,0,.45);
    }
    .tiktok-logo {
      flex:0 0 76px; width:76px; height:76px; display:grid; place-items:center;
      border-radius:18px; background:#000; color:#fff; font-family:Arial,sans-serif;
      font-size:4.5rem; line-height:1; text-shadow:-3px -2px 0 #25f4ee,3px 2px 0 #fe2c55;
    }
    .tiktok-button .button-copy {display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-width:0}
    .tiktok-button .button-small {font-family:Arial,sans-serif;font-size:.9rem;font-weight:900;letter-spacing:2px}
    .tiktok-button .button-big {font-size:clamp(1.7rem,7vw,3.2rem);font-weight:900;letter-spacing:1px;line-height:1.1}
    @media(max-width:600px) {
      .tiktok-button {width:96%}
      .tiktok-logo {flex-basis:58px;width:58px;height:58px;font-size:3.5rem}
      .tiktok-button .button-small {font-size:.875rem;letter-spacing:.5px}
      .tiktok-button .button-big {font-size:clamp(1.35rem,6vw,2.4rem)}
    }
  </style>
</head>

<body>

  <main class="socials-page">

    <div class="stars" aria-hidden="true"></div>

    <div class="socials-container">

      <header class="socials-header">
        <div class="follow-word">FOLLOW</div>
        <div class="moms-word">$MOMS</div>
        <div class="everywhere-word">EVERYWHERE</div>
      </header>


      <section class="social-buttons">

        <!-- X -->
        <a
          class="social-button x-button"
          href="https://x.com/Yourmomstoken"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="button-small">FOLLOW $MOMS ON</span>
          <span class="x-logo">𝕏</span>
        </a>


        <!-- TELEGRAM -->
        <a
          class="social-button telegram-button"
          href="https://t.me/MOMS_Solana"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="telegram-logo">➤</span>

          <span class="button-copy">
            <span class="button-small">JOIN OUR</span>
            <span class="button-big">TELEGRAM</span>
          </span>
        </a>


        <!-- YOUTUBE -->
        <a
          class="social-button youtube-button"
          href="https://youtube.com/@yourmomsshow"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="youtube-logo">▶</span>

          <span class="button-copy">
            <span class="button-small">SUBSCRIBE ON</span>
            <span class="button-big">YOUTUBE</span>
          </span>
        </a>


        <!-- FACEBOOK -->
        <a
          class="social-button facebook-button"
          href="https://www.facebook.com/share/1CJecmBx9e/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Follow $MOMS on Facebook"
        >
          <span class="facebook-logo" aria-hidden="true">f</span>
          <span class="button-copy">
            <span class="button-small">FOLLOW $MOMS ON</span>
            <span class="button-big">FACEBOOK</span>
          </span>
        </a>

        <!-- TIKTOK -->
        <a
          class="social-button tiktok-button"
          href="https://www.tiktok.com/@yourmomsshow"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Follow $MOMS on TikTok"
        >
          <span class="tiktok-logo" aria-hidden="true">♪</span>
          <span class="button-copy">
            <span class="button-small">FOLLOW $MOMS ON</span>
            <span class="button-big">TIKTOK</span>
          </span>
        </a>
      </section>


      <!-- HOME -->
      <div class="home-section">
        <a class="home-button" href="/">
          <span class="heart">♥</span>
          <span>HOME</span>
        </a>
      </div>

    </div>

  </main>


  <script
    data-goatcounter="https://yourmoms.goatcounter.com/count"
    async
    src="//gc.zgo.at/count.js">
  </script>

</body>
</html>
