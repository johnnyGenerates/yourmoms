<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="Follow Your $MOMS everywhere. Official social links for Your $MOMS.">

  <title>Follow Your $MOMS</title>

  <link rel="icon" type="image/png" href="/favicon.png">

  <!-- Your CSS is currently inside socials/socials/ -->
  <link rel="stylesheet" href="socials/style.css">
</head>

<body>

  <main class="socials-page">

    <div class="stars" aria-hidden="true"></div>
    <div class="pink-glow glow-left" aria-hidden="true"></div>
    <div class="pink-glow glow-right" aria-hidden="true"></div>

    <div class="socials-container">

      <header class="socials-header">
        <div class="follow-word">FOLLOW</div>

        <div class="moms-word">
          <span>$MOMS</span>
        </div>

        <div class="everywhere-word">EVERYWHERE</div>
      </header>


      <section class="social-buttons"
               aria-label="Official Your MOMS social media">

        <!-- X -->
        <a
          class="social-button x-button"
          href="https://x.com/Yourmomstoken"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Follow Your MOMS on X"
        >
          <span class="button-shine"></span>

          <span class="button-content">
            <span class="button-small">FOLLOW $MOMS ON</span>
            <span class="x-logo">𝕏</span>
          </span>
        </a>


        <!-- TELEGRAM -->
        <a
          class="social-button telegram-button"
          href="https://t.me/YourMOMSSolanaToken"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Join Your MOMS Telegram"
        >
          <span class="button-shine"></span>

          <span class="telegram-logo">➤</span>

          <span class="button-copy">
            <span class="button-small">JOIN OUR</span>
            <span class="button-big">TELEGRAM</span>
          </span>
        </a>


        <!-- YOUTUBE -->
        <a
          class="social-button youtube-button"
          href="https://youtube.com/@yourmomsshow"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Subscribe to Your MOMS on YouTube"
        >
          <span class="button-shine"></span>

          <span class="youtube-logo">
            <span class="play-triangle">▶</span>
          </span>

          <span class="button-copy">
            <span class="button-small">SUBSCRIBE ON</span>
            <span class="button-big">YOUTUBE</span>
          </span>
        </a>

      </section>


      <!-- HOME -->
      <div class="home-section">

        <a
          class="home-button"
          href="/"
          aria-label="Go to Your MOMS homepage"
        >
          <span class="home-heart">♥</span>
          <span class="home-text">HOME</span>
        </a>

      </div>

    </div>

  </main>


  <!-- GoatCounter analytics -->
  <script
    data-goatcounter="https://yourmoms.goatcounter.com/count"
    async
    src="//gc.zgo.at/count.js">
  </script>

</body>
</html>
