<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Follow Your $MOMS everywhere.">
  <title>Follow Your $MOMS</title>

  <link rel="icon" type="image/png" href="/favicon.png">

  <link rel="stylesheet" href="socials/style.css?v=facebook-20260925-2">
</head>

<body>

  <main class="socials-page">

    <div class="stars" aria-hidden="true"></div>

    <div class="socials-container">

      <header class="socials-header">
        <div class="follow-word">FOLLOW</div>
        <div class="moms-word">$MOMS</div>
        <div class="everywhere-word">EVERYWHERE</div>
      </header>


      <section class="social-buttons">

        <!-- X -->
        <a
          class="social-button x-button"
          href="https://x.com/Yourmomstoken"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="button-small">FOLLOW $MOMS ON</span>
          <span class="x-logo">𝕏</span>
        </a>


        <!-- TELEGRAM -->
        <a
          class="social-button telegram-button"
          href="https://t.me/MOMS_Solana"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="telegram-logo">➤</span>

          <span class="button-copy">
            <span class="button-small">JOIN OUR</span>
            <span class="button-big">TELEGRAM</span>
          </span>
        </a>


        <!-- YOUTUBE -->
        <a
          class="social-button youtube-button"
          href="https://youtube.com/@yourmomsshow"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="youtube-logo">▶</span>

          <span class="button-copy">
            <span class="button-small">SUBSCRIBE ON</span>
            <span class="button-big">YOUTUBE</span>
          </span>
        </a>


        <!-- FACEBOOK -->
        <a
          class="social-button facebook-button"
          href="https://www.facebook.com/people/Your-Moms-Show/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Follow $MOMS on Facebook"
        >
          <span class="facebook-logo" aria-hidden="true">f</span>
          <span class="button-copy">
            <span class="button-small">FOLLOW $MOMS ON</span>
            <span class="button-big">FACEBOOK</span>
          </span>
        </a>
      </section>


      <!-- HOME -->
      <div class="home-section">
        <a class="home-button" href="/">
          <span class="heart">♥</span>
          <span>HOME</span>
        </a>
      </div>

    </div>

  </main>


  <script
    data-goatcounter="https://yourmoms.goatcounter.com/count"
    async
    src="//gc.zgo.at/count.js">
