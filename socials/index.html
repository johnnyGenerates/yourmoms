<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
        content="Follow Your $MOMS everywhere. Official social links for Your $MOMS.">

  <title>Follow Your $MOMS</title>

  <link rel="icon" type="image/png" href="/favicon.png">

  <link rel="stylesheet" href="socials/style.css">
</head>

<body>

  <div class="socials-page">

    <!-- Decorative background -->
    <div class="stars"></div>
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <!-- Main content -->
    <main class="socials-container">

      <!-- Title -->
      <header class="socials-header">

        <div class="follow-text">
          FOLLOW
        </div>

        <h1>
          <span class="moms-title">$MOMS</span>
        </h1>

        <div class="everywhere-text">
          EVERYWHERE
        </div>

      </header>


      <!-- Social buttons -->
      <section class="social-buttons"
               aria-label="Your MOMS official social media">

        <!-- X -->
        <a
          class="social-button x-button"
          href="https://x.com/Yourmomstoken"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Follow Your MOMS on X"
        >
          <span class="social-icon">𝕏</span>

          <span class="button-text">
            <small>FOLLOW $MOMS ON</small>
            <strong>X</strong>
          </span>
        </a>


        <!-- Telegram -->
        <a
          class="social-button telegram-button"
          href="https://t.me/YourMOMSSolanaToken"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Join Your MOMS on Telegram"
        >
          <span class="social-icon">✈</span>

          <span class="button-text">
            <small>JOIN OUR</small>
            <strong>TELEGRAM</strong>
          </span>
        </a>


        <!-- YouTube -->
        <a
          class="social-button youtube-button"
          href="https://youtube.com/@yourmomsshow"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Subscribe to Your MOMS on YouTube"
        >
          <span class="youtube-icon">
            ▶
          </span>

          <span class="button-text">
            <small>SUBSCRIBE ON</small>
            <strong>YOUTUBE</strong>
          </span>
        </a>

      </section>


      <!-- Back home -->
      <div class="home-section">

        <a
          class="home-button"
          href="/"
          aria-label="Back to Your MOMS homepage"
        >
          <span class="heart">♥</span>

          <span>
            BACK TO<br>
            <strong>YOUR $MOMS</strong>
          </span>
        </a>

      </div>

    </main>

  </div>


  <!-- GoatCounter analytics -->
  <script
    data-goatcounter="https://yourmoms.goatcounter.com/count"
    async
    src="//gc.zgo.at/count.js">
  </script>

</body>
</html>
